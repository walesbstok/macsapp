name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Zwiększamy limit pamięci RAM dla kompilatora do 4 Gigabajtów
      # Wyłączamy też zbędny Daemon, aby zaoszczędzić pamięć
      - name: Configure Gradle Memory & AndroidX
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          
          echo "android.useAndroidX=true" >> app/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> app/gradle.properties
          echo "org.gradle.daemon=false" >> app/gradle.properties

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: macscrm-app-apk
          path: app/build/outputs/apk/debug/app-debug.apk
