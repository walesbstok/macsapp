name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 1. Ten krok pobierze i poprawnie skonfiguruje narzędzie Gradle w systemie
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 2. Ten krok wykona kompilację przy użyciu pobranego wyżej programu
      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: macscrm-app-apk
          path: app/build/outputs/apk/debug/app-debug.apk
